name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = $tag -replace '^v', ''
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $desktop = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $expected) {
            throw "Root package.json version $($pkg.version) does not match tag $tag (expected $expected)."
          }
          if ($desktop.version -ne $expected) {
            throw "apps/desktop/package.json version $($desktop.version) does not match tag $tag (expected $expected)."
          }
          Write-Host "Version check OK: $expected"

      - name: Install dependencies
        run: npm ci

      - name: Write Auth env for packaged desktop
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          if (-not $env:VITE_SUPABASE_URL -or -not $env:VITE_SUPABASE_ANON_KEY) {
            throw "VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY secrets are required."
          }
          $lines = @(
            "VITE_SUPABASE_URL=$env:VITE_SUPABASE_URL"
            "VITE_SUPABASE_ANON_KEY=$env:VITE_SUPABASE_ANON_KEY"
          )
          # Only ship HS256 secret when explicitly set. Prefer JWKS (ES256) verify — never bake an empty secret.
          if ($env:SUPABASE_JWT_SECRET -and $env:SUPABASE_JWT_SECRET.Trim().Length -gt 0) {
            Write-Warning "SUPABASE_JWT_SECRET is set — it will be embedded in the installer for legacy HS256 tokens. Prefer JWKS-only if your project uses ES256."
            $lines += "SUPABASE_JWT_SECRET=$env:SUPABASE_JWT_SECRET"
          }
          $lines | Set-Content -Encoding utf8NoBOM .env

      - name: Build UI and server
        run: npm run build:all

      - name: Rebuild native modules for Electron
        run: npm run electron:rebuild-native

      - name: Prepare packaged Auth env
        run: node scripts/prepare-desktop-env.cjs

      - name: Build installer (unsigned)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Code signing deferred for now. Document SmartScreen on the website.
          Write-Warning "Building unsigned installer (Unknown publisher) — SmartScreen guidance is on the download page."
          Set-Location apps/desktop
          npx electron-builder --win --x64 --publish always --config electron-builder.json

      - name: Ensure GitHub Release assets are complete
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem -Path "out/desktop" -Filter "Hello-Darzi-Setup-*.exe" -File | Select-Object -First 1
          $blockmap = Get-ChildItem -Path "out/desktop" -Filter "Hello-Darzi-Setup-*.exe.blockmap" -File | Select-Object -First 1
          $yml = Get-Item -Path "out/desktop/latest.yml" -ErrorAction SilentlyContinue
          if (-not $exe -or -not $yml) {
            throw "Expected installer .exe and latest.yml in out/desktop before publishing release assets."
          }
          $files = @($exe.FullName, $yml.FullName)
          if ($blockmap) { $files += $blockmap.FullName }
          gh release upload $tag $files --clobber

          # Fail the job if the published release is still missing the installer
          $assets = gh release view $tag --json assets | ConvertFrom-Json
          $names = @($assets.assets | ForEach-Object { $_.name })
          $hasExe = $names | Where-Object { $_ -like 'Hello-Darzi-Setup-*.exe' -and $_ -notlike '*.blockmap' }
          $hasYml = $names | Where-Object { $_ -eq 'latest.yml' }
          if (-not $hasExe -or -not $hasYml) {
            throw "Release $tag is incomplete after upload. Assets: $($names -join ', ')"
          }
          Write-Host "Release $tag assets verified: $($names -join ', ')"

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-darzi-installer
          path: |
            out/desktop/Hello-Darzi-Setup-*.exe
            out/desktop/latest.yml
          if-no-files-found: error
