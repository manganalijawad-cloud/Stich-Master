name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write Auth env for packaged desktop
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          @(
            "VITE_SUPABASE_URL=$env:VITE_SUPABASE_URL"
            "VITE_SUPABASE_ANON_KEY=$env:VITE_SUPABASE_ANON_KEY"
            "SUPABASE_JWT_SECRET=$env:SUPABASE_JWT_SECRET"
          ) | Set-Content -Encoding utf8NoBOM .env

      - name: Build UI and server
        run: npm run build:all

      - name: Rebuild native modules for Electron
        run: npm run electron:rebuild-native

      - name: Prepare packaged Auth env
        run: node scripts/prepare-desktop-env.cjs

      - name: Build installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure Trusted Signing (Artifact Signing). Required for a trusted publisher.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: |
          $config = if ($env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET -and $env:AZURE_TENANT_ID -and $env:AZURE_TRUSTED_SIGNING_ENDPOINT -and $env:AZURE_CODE_SIGNING_ACCOUNT_NAME -and $env:AZURE_CERTIFICATE_PROFILE_NAME -and $env:AZURE_PUBLISHER_NAME) {
            Write-Host "Signing with Azure Trusted Signing"
            "electron-builder.azure.json"
          } else {
            Write-Warning "Azure Trusted Signing secrets missing — building unsigned installer (Unknown publisher)"
            "electron-builder.json"
          }
          Set-Location apps/desktop
          npx electron-builder --win --x64 --publish always --config $config

      - name: Ensure GitHub Release assets are complete
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            Get-ChildItem -Path "out/desktop" -Filter "Hello-Darzi-Setup-*.exe" -File
            Get-ChildItem -Path "out/desktop" -Filter "Hello-Darzi-Setup-*.exe.blockmap" -File
            Get-Item -Path "out/desktop/latest.yml"
          )
          if ($files.Count -lt 2) {
            throw "Expected installer and latest.yml in out/desktop, found $($files.Count) file(s)."
          }
          gh release upload $tag $files.FullName --clobber

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-darzi-installer
          path: |
            out/desktop/Hello-Darzi-Setup-*.exe
            out/desktop/latest.yml
          if-no-files-found: error
