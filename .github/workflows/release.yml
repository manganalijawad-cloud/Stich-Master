name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write Auth env for packaged desktop
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          @(
            "VITE_SUPABASE_URL=$env:VITE_SUPABASE_URL"
            "VITE_SUPABASE_ANON_KEY=$env:VITE_SUPABASE_ANON_KEY"
            "SUPABASE_JWT_SECRET=$env:SUPABASE_JWT_SECRET"
          ) | Set-Content -Encoding utf8NoBOM .env

      - name: Build UI and server
        run: npm run build:all

      - name: Prepare packaged Auth env
        run: node scripts/prepare-desktop-env.cjs

      - name: Build installer
        run: cd apps/desktop; npx electron-builder --win --x64 --publish always --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-darzi-installer
          path: |
            out/desktop/Hello-Darzi-Setup-*.exe
            out/desktop/latest.yml
          if-no-files-found: error
