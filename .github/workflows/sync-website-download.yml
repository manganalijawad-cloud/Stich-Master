name: Sync website download

# After every GitHub Release is published, refresh apps/website/release/*
# so the static fallback matches the latest installer (the site also fetches live).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Wait for installer asset, then generate manifest
        working-directory: apps/website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: fetching latest release for website download..."
            node build.mjs
            if grep -q '"downloadUrl"' release/version.js && ! grep -q '"downloadUrl": null' release/version.js; then
              echo "Manifest ready."
              exit 0
            fi
            echo "Installer not visible yet; waiting 20s..."
            sleep 20
          done
          echo "Timed out waiting for latest release installer asset."
          exit 1

      - name: Commit and push if manifest changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/website/release/version.js apps/website/release/manifest.json
          if git diff --staged --quiet; then
            echo "Website download manifest already up to date."
            exit 0
          fi
          git commit -m "Sync website download to latest GitHub release."
          git push origin HEAD:main
