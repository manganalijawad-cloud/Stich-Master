<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello Darzi</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      color: #f8fafc;
      font-family: "Segoe UI", Tahoma, sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      opacity: 0;
      animation: splash-in 320ms ease-out forwards;
    }
    .mark {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(148, 163, 184, 0.35);
      display: grid;
      place-items: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    .mark span {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #e2e8f0;
    }
    .brand {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .sub {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .track {
      width: 148px;
      height: 3px;
      margin-top: 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.2);
      overflow: hidden;
    }
    .bar {
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #38bdf8, #e2e8f0, #38bdf8);
      background-size: 200% 100%;
      animation: shimmer 1.1s ease-in-out infinite;
    }
    @keyframes splash-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-120%); background-position: 0% 50%; }
      100% { transform: translateX(320%); background-position: 100% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wrap { animation: none; opacity: 1; }
      .bar { animation: none; width: 55%; }
    }
  </style>
</head>
<body>
  <div class="wrap" role="status" aria-live="polite" aria-label="Starting Hello Darzi">
    <div class="mark" aria-hidden="true"><span>HD</span></div>
    <h1 class="brand">Hello Darzi</h1>
    <p class="sub">Starting</p>
    <div class="track" aria-hidden="true"><div class="bar"></div></div>
  </div>
</body>
</html>
