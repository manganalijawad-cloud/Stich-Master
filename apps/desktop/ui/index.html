<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hello Darzi — Tailor Shop Management</title>
    <meta name="description" content="Professional tailor shop management for orders, customers, measurements, and financial reporting." />
    <meta name="application-name" content="Hello Darzi" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hello Darzi — Tailor Shop Management" />
    <meta property="og:description" content="Professional tailor shop management for orders, customers, measurements, and financial reporting." />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hello Darzi — Tailor Shop Management" />
    <meta name="twitter:description" content="Professional tailor shop management for orders, customers, measurements, and financial reporting." />
    <meta name="twitter:image" content="/apple-touch-icon.png" />
    <meta name="msapplication-TileColor" content="#0F172A" />
    <meta name="msapplication-TileImage" content="/favicon-96x96.png" />
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite" aria-label="Loading Hello Darzi">
        <div class="boot-splash-mark" aria-hidden="true">
          <img src="/apple-touch-icon.png" alt="" width="48" height="48" />
        </div>
        <div class="boot-splash-brand">Hello Darzi</div>
        <div class="boot-splash-sub">Loading</div>
        <div class="boot-splash-track" aria-hidden="true"><div class="boot-splash-bar"></div></div>
      </div>
    </div>
    <style>
      .boot-splash {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0f172a;
        color: #f8fafc;
        font-family: "Segoe UI", Tahoma, sans-serif;
        opacity: 0;
        animation: boot-splash-in 280ms ease-out forwards;
      }
      .boot-splash-mark {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: #0f172a;
      }
      .boot-splash-mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }
      .boot-splash-brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .boot-splash-sub {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #94a3b8;
      }
      .boot-splash-track {
        width: 140px;
        height: 3px;
        margin-top: 6px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.2);
        overflow: hidden;
      }
      .boot-splash-bar {
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #38bdf8, #e2e8f0, #38bdf8);
        animation: boot-splash-shimmer 1.1s ease-in-out infinite;
      }
      @keyframes boot-splash-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-splash-shimmer {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash { animation: none; opacity: 1; }
        .boot-splash-bar { animation: none; width: 55%; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
