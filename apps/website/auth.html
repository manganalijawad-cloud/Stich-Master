<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Hello Darzi</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Helvetica Neue', 'Arial', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            brand: {
              sidebar: '#0F172A',
              active: '#1E293B',
              sky: '#38BDF8',
              bg: '#F8FAFC',
            },
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="font-sans text-slate-800 bg-brand-bg antialiased min-h-screen">
  <div id="app" class="min-h-screen flex flex-col">
    <header class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200/60">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <a href="/" class="flex items-center gap-2.5 group" aria-label="Hello Darzi — Home">
            <img src="/favicon.svg" alt="" class="w-7 h-7 shrink-0" />
            <span class="font-display font-bold text-xl text-brand-sidebar">Hello Darzi</span>
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 pt-24 pb-12">
      <div id="auth-container" class="w-full max-w-sm">
        <!-- Signed out state -->
        <div id="signed-out" class="animate-fade-in">
          <div class="text-center mb-8">
            <img src="/favicon.svg" alt="Hello Darzi" class="w-14 h-14 mx-auto mb-4" />
            <h1 class="font-display text-2xl font-bold text-brand-sidebar tracking-tight">Welcome back</h1>
            <p class="text-sm text-slate-500 mt-1.5">Sign in to manage your account</p>
          </div>

          <div id="auth-error" class="hidden rounded-lg bg-red-50 border border-red-200 px-4 py-3 mb-4">
            <p id="auth-error-text" class="text-sm font-medium text-red-600"></p>
          </div>

          <button
            id="google-signin-btn"
            type="button"
            class="google-btn w-full flex items-center justify-center gap-3 px-6 py-3 bg-white hover:bg-slate-50 text-slate-700 font-medium text-sm rounded-xl border border-slate-300 shadow-sm hover:shadow-md hover:border-slate-400 transition-all duration-200 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:shadow-sm"
          >
            <span id="google-btn-content" class="flex items-center gap-3">
              <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              <span id="google-btn-text">Continue with Google</span>
            </span>
            <span id="google-btn-loader" class="hidden">
              <svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
              <span>Connecting...</span>
            </span>
          </button>

          <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-slate-200" />
            </div>
            <div class="relative flex justify-center">
              <span class="px-3 text-xs font-medium text-slate-400 bg-brand-bg">OR</span>
            </div>
          </div>

          <form id="email-signin-form" class="space-y-4">
            <div>
              <input
                type="email"
                id="email-input"
                placeholder="Email address"
                autocomplete="email"
                class="w-full h-11 px-4 bg-white border border-slate-300 rounded-xl text-sm text-slate-800 placeholder-slate-400 outline-none focus:border-brand-sky focus:ring-2 focus:ring-brand-sky/20 transition-all duration-200"
              />
            </div>
            <div>
              <input
                type="password"
                id="password-input"
                placeholder="Password"
                autocomplete="current-password"
                class="w-full h-11 px-4 bg-white border border-slate-300 rounded-xl text-sm text-slate-800 placeholder-slate-400 outline-none focus:border-brand-sky focus:ring-2 focus:ring-brand-sky/20 transition-all duration-200"
              />
            </div>
            <button
              type="submit"
              id="email-signin-btn"
              class="w-full h-11 bg-brand-sidebar hover:bg-brand-active text-white font-semibold text-sm rounded-xl transition-all duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Sign in with Email
            </button>
          </form>

          <p class="mt-6 text-center text-sm text-slate-500">
            Don&apos;t have an account?
            <a href="/auth.html?action=signup" class="text-brand-sky hover:text-sky-600 font-medium transition-colors">Create one</a>
          </p>
        </div>

        <!-- Signed in state -->
        <div id="signed-in" class="hidden animate-fade-in text-center">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 mb-6">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <h2 class="font-display text-xl font-bold text-brand-sidebar mb-2">Signed in</h2>
          <p id="user-email-display" class="text-sm text-slate-500 mb-6"></p>
          <p class="text-sm text-slate-500 mb-8">
            You can now use Hello Darzi on this browser.
            <br/>Download the desktop app for full features.
          </p>
          <div class="flex flex-col gap-3">
            <a href="/" class="inline-flex items-center justify-center px-6 py-3 bg-brand-sky text-brand-sidebar font-semibold text-sm rounded-xl hover:bg-cyan-300 transition-all duration-200">
              Back to Home
            </a>
            <a href="/#download" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-brand-sidebar text-white font-semibold text-sm rounded-xl hover:bg-brand-active transition-all duration-200">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v12m0 0-3-3m3 3 3-3M5 19h14"/></svg>
              Download Desktop App
            </a>
            <button
              id="sign-out-btn"
              type="button"
              class="text-sm text-slate-400 hover:text-slate-600 font-medium transition-colors cursor-pointer bg-transparent border-none"
            >
              Sign out
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Environment variables (injected during deployment) -->
  <script src="env.js"></script>

  <!-- Supabase JS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
</body>
</html>
