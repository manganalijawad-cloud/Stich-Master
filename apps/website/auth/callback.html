<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset — Hello Darzi</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" /></noscript>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-[#0F172A] text-white min-h-screen flex flex-col items-center justify-center px-4">
  <div class="text-center">
    <div id="loading-state">
      <svg class="w-10 h-10 text-cyan-400 animate-spin mx-auto mb-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      <h1 class="font-display text-xl font-bold mb-2">Redirecting...</h1>
      <p class="text-sm text-slate-400">Please wait</p>
    </div>

    <div id="error-state" class="hidden">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-red-500/10 flex items-center justify-center">
        <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
      </div>
      <h1 class="font-display text-xl font-bold mb-2">Something went wrong</h1>
      <p id="error-message" class="text-sm text-slate-400 mb-6">Could not continue.</p>
      <a href="/auth.html" class="inline-flex items-center px-6 py-3 bg-cyan-400 text-slate-900 font-semibold text-sm rounded-xl hover:bg-cyan-300 transition-all duration-200">
        Back to sign in
      </a>
    </div>
  </div>

  <script>
    (function() {
      var hash = window.location.hash || '';
      var params = new URLSearchParams(hash.replace('#', '?'));
      var type = params.get('type');

      // Password recovery links may still point here — forward to auth.html with hash intact
      if (type === 'recovery' || hash.includes('type=recovery')) {
        window.location.href = '/auth.html' + hash;
        return;
      }

      // OAuth/Google signup callbacks are no longer supported (PROJECT.md §3)
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
      document.getElementById('error-message').textContent =
        'Sign-in with Google is no longer available. Please sign in with email and password.';
    })();
  </script>
</body>
</html>
