# Hello Darzi marketing site (apps/website).
# Primary hosting is Vercel; this config keeps the linked Netlify site building
# reliably in the monorepo so PR deploy-preview checks can pass.

[build]
  base = "apps/website"
  command = "npm run build"
  publish = "."
  # Build when the site or this config changes; skip desktop-only commits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[[redirects]]
  from = "/login"
  to = "/auth.html"
  status = 301

[[redirects]]
  from = "/signin"
  to = "/auth.html"
  status = 301

[[redirects]]
  from = "/signup"
  to = "/auth.html?action=signup"
  status = 301

[[redirects]]
  from = "/forgot-password"
  to = "/auth.html?action=forgot"
  status = 301

[[redirects]]
  from = "/download"
  to = "/#download"
  status = 301

[[redirects]]
  from = "/github"
  to = "https://github.com/manganalijawad-cloud/Stich-Master"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/release/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
